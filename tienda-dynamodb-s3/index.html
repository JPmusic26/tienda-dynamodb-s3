<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda Digital Dynamo</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2733;--mut:#5d6b7a;--ac:#1f6f5c;--bd:#d9dee4;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1c2229;--tx:#e8edf2;--mut:#9aa7b4;--ac:#4fb59a;--bd:#2c353f;--err:#f2938c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--mut)}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
nav button{padding:8px 16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}
nav button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
section{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:16px;margin-bottom:16px}
form{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:.875rem;color:var(--mut);gap:4px}
input{padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.btn{padding:9px 18px;border:0;border-radius:6px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.barra{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
#conteo{color:var(--mut);font-size:.875rem}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:.875rem}
td img{height:40px;border-radius:4px;display:block}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
#consulta[hidden]{display:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sesion{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:.875rem}
#msg{min-height:1.5em;margin:0 0 12px}
#msg.err{color:var(--err)}
</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>Tienda Digital Dynamo</h1>
      <p class="sub">Datos en DynamoDB, imágenes en S3, servidos desde EC2.</p>
    </div>
    <div class="sesion"><span id="quien"></span><button type="button" class="btn sec" id="salir">Salir</button></div>
  </header>

  <nav id="tabs">
    <button data-t="clientes">Clientes</button>
    <button data-t="productos">Productos</button>
    <button data-t="ventas">Ventas</button>
    <button data-t="s3">Archivos en S3</button>
  </nav>

  <p id="msg" role="status"></p>

  <section id="nuevo" hidden>
    <form id="form"></form>
  </section>

  <section>
    <div class="barra">
      <form id="consulta">
        <label>Consultar por ID <input id="buscar" placeholder="Ej. C003" autocomplete="off"></label>
        <button class="btn">Consultar</button>
        <button type="button" class="btn sec" id="todos">Ver todos</button>
      </form>
      <span id="conteo"></span>
    </div>
    <div class="scroll"><table id="tabla"></table></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
let actual = 'clientes', datos = [];

const campos = {
  clientes: [['nombre','Nombre'],['correo','Correo','email'],['ciudad','Ciudad']],
  productos: [['nombre','Nombre'],['categoria','Categoría'],['precio','Precio','number']]
};

async function api(url, opts) {
  const r = await fetch(url, opts);
  const d = await r.json();
  if (r.status === 401) location.href = '/login';
  if (!r.ok) throw new Error(d.error || 'Error en el servidor');
  return d;
}

function msg(texto, error) {
  const m = $('#msg');
  m.textContent = texto;
  m.className = error ? 'err' : '';
}

function pintarForm() {
  const f = $('#form');
  const defs = campos[actual];
  $('#nuevo').hidden = !defs;
  f.replaceChildren();
  if (!defs) return;
  const lid = document.createElement('label');
  lid.append('ID (automático)');
  const iid = document.createElement('input');
  Object.assign(iid, {readOnly: true, value: '…'});
  lid.append(iid);
  f.append(lid);
  api('/api/siguiente-id/' + actual).then(r => { iid.value = r.id; }).catch(() => { iid.value = ''; });
  defs.forEach(([name, texto, tipo]) => {
    const l = document.createElement('label');
    l.append(texto);
    const i = document.createElement('input');
    Object.assign(i, {name, required: true, type: tipo || 'text'});
    if (tipo === 'number') i.step = '0.01';
    l.append(i);
    f.append(l);
  });
  if (actual === 'productos') {
    const l = document.createElement('label');
    l.append('Foto (se sube a S3)');
    const i = document.createElement('input');
    Object.assign(i, {name: 'imagen', type: 'file', accept: 'image/*'});
    l.append(i);
    f.append(l);
  }
  const b = document.createElement('button');
  b.className = 'btn';
  b.textContent = actual === 'clientes' ? 'Guardar cliente' : 'Guardar producto';
  f.append(b);
}

function pintarTabla() {
  const filas = datos;
  const cols = [...new Set(datos.flatMap(d => Object.keys(d)))]
    .filter(c => c !== 'imagen')
    .sort((a, b) => /Id$/.test(b) - /Id$/.test(a));
  const t = $('#tabla');
  t.replaceChildren();
  const cab = t.createTHead().insertRow();
  cols.forEach(c => {
    const th = document.createElement('th');
    th.textContent = c === 'imagenUrl' ? 'foto' : c;
    cab.append(th);
  });
  const cuerpo = t.createTBody();
  filas.forEach(d => {
    const tr = cuerpo.insertRow();
    cols.forEach(c => {
      const td = tr.insertCell();
      if (c === 'imagenUrl' && d[c]) {
        const img = document.createElement('img');
        img.src = d[c];
        img.alt = d.nombre || '';
        td.append(img);
      } else td.textContent = d[c] ?? '';
    });
  });
  $('#conteo').textContent = filas.length ? filas.length + ' registros' : 'Sin registros';
}

async function cargar() {
  try {
    datos = await api(actual === 's3' ? '/api/s3/archivos' : '/api/' + actual);
    pintarForm();
    $('#consulta').hidden = actual === 's3';
    $('#buscar').placeholder = {clientes: 'Ej. C003', productos: 'ID del producto', ventas: 'ID de la venta'}[actual] || '';
    pintarTabla();
  } catch (e) { msg(e.message, true); }
}

$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  actual = b.dataset.t;
  document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-pressed', x === b));
  $('#buscar').value = '';
  msg('');
  cargar();
});

$('#consulta').addEventListener('submit', async e => {
  e.preventDefault();
  const id = $('#buscar').value.trim();
  if (!id) { msg('Escribe un ID para consultar', true); return; }
  try {
    datos = [await api('/api/consulta/' + actual + '/' + encodeURIComponent(id))];
    msg('');
    pintarTabla();
    $('#conteo').textContent = 'Resultado de la consulta por ID';
  } catch (err) { msg(err.message, true); }
});

$('#todos').addEventListener('click', () => { $('#buscar').value = ''; msg(''); cargar(); });

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  try {
    if (actual === 'clientes') {
      await api('/api/clientes', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(Object.fromEntries(new FormData(f)))
      });
    } else {
      await api('/api/productos', {method: 'POST', body: new FormData(f)});
    }
    f.reset();
    await cargar();
    msg('Guardado en DynamoDB');
  } catch (err) { msg(err.message, true); }
});

api('/api/yo').then(d => { $('#quien').textContent = d.nombre; }).catch(() => {});

$('#salir').addEventListener('click', async () => {
  await fetch('/api/logout', {method: 'POST'});
  location.href = '/login';
});

document.querySelector('#tabs button').click();
</script>
</body>
</html>
